name: Release

# Automated semver releases on every push to main.
#
# How it works:
#   1. python-semantic-release analyses conventional commits since the last tag.
#   2. If releasable commits exist it:
#        - bumps project.version in pyproject.toml
#        - regenerates CHANGELOG.md
#        - creates a signed git tag (e.g. v0.2.0)
#        - creates a GitHub Release with the changelog as body
#   3. The CD pipeline (cd.yml) is triggered by the version-bump commit on main
#      and deploys the new version to staging → prod.
#
# Commit → version mapping (pre-1.0 behaviour):
#   fix: / perf:   patch   0.1.0 → 0.1.1
#   feat:          minor   0.1.0 → 0.2.0
#   feat!: / BREAKING CHANGE:  major  0.1.0 → 1.0.0

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"   # avoid infinite loop when PSR commits the changelog

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release          # one release at a time

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history required for commit analysis
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: python-semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release version
          uv run semantic-release publish
