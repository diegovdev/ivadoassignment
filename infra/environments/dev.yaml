# Dev / local stack — single AZ, smallest instances, no HA.
# Usage: pulumi up --stack dev --config-file environments/dev.yaml
config:
  museums:environment: dev
  museums:az_count: "1"
  museums:api_cpu: "256"
  museums:api_memory: "512"
  museums:ecs_api_desired: "1"
  museums:ecs_api_min: "1"
  museums:ecs_api_max: "1"
  museums:db_instance_class: db.t3.micro
  museums:db_multi_az: "false"
  museums:db_deletion_protection: "false"
  museums:log_retention_days: "3"
  museums:rds_auto_shutdown: "true"
  museums:alarm_email: dev@example.com
